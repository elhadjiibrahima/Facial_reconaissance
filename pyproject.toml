[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-reconnaissance"
version = "1.1.0"
description = "Reconnaissance faciale, détection d'émotions et pointage des employés"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "El Hadji Ibrahima Diallo"}]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.21.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
visage = "visage:main"
pointage = "pointage:main"

[tool.setuptools]
py-modules = ["visage", "pointage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
